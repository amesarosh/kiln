[package]
name = "wayland-time"
version = "0.1.0"
edition = "2024"
description = "A lightweight, fast, configurable tiling Wayland compositor"
license = "MIT"

[workspace]
members = ["crates/*", "apps/*"]
# A plain `cargo build` builds the compositor and its apps.
default-members = [".", "apps/*"]

[dependencies]
wt-config = { path = "crates/wt-config" }
bitflags = "2"
inotify = { version = "0.11", default-features = false }
smithay-drm-extras = { version = "0.1", default-features = false }
xcursor = "0.3"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
tracing = "0.1"
# Our own Xwayland connection, for window properties smithay doesn't set.
x11rb = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
skrifa = "0.42"
png = "0.18"
resvg = { version = "0.45", default-features = false }
rustix = { version = "1", features = ["pipe", "fs"] }
libc = "0.2"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
