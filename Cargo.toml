[package]
name = "wayland-time"
version = "0.1.0"
edition = "2024"
description = "A lightweight, fast, configurable tiling Wayland compositor"
license = "MIT"

[dependencies]
bitflags = "2"
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop", "renderer_gl"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
