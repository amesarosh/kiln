[package]
name = "wayland-time"
version = "0.1.0"
edition = "2024"
description = "A lightweight, fast, configurable tiling Wayland compositor"
license = "MIT"

[dependencies]
bitflags = "2"
inotify = { version = "0.11", default-features = false }
smithay-drm-extras = { version = "0.1", default-features = false }
xcursor = "0.3"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ab_glyph = "0.2"
png = "0.18"
resvg = { version = "0.45", default-features = false }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
