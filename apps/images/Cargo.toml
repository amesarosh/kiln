[package]
name = "kiln-image-viewer"
version.workspace = true
edition.workspace = true
description = "Image viewer for the kiln compositor"
license.workspace = true

[dependencies]
kiln-config = { path = "../../crates/kiln-config" }
kiln-ui = { path = "../../crates/kiln-ui" }
# Folder listing order, file sizes, icons and the trash, shared with the file manager.
kiln-files = { path = "../files" }
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm",
] }
resvg.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
