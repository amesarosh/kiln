[package]
name = "wayland-time-image-viewer"
version = "0.1.0"
edition = "2024"
description = "Image viewer for the wayland-time compositor"
license = "MIT"

[dependencies]
wt-config = { path = "../../crates/wt-config" }
wt-ui = { path = "../../crates/wt-ui" }
# Folder listing order, file sizes, icons and the trash, shared with the file manager.
wayland-time-files = { path = "../files" }
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm",
] }
resvg = { version = "0.45", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
