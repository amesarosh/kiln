[package]
name = "wayland-time-sound"
version = "0.1.0"
edition = "2024"
description = "Sound for the wayland-time compositor: output and input devices, volumes, and each app's volume"
license = "MIT"

[dependencies]
wt-config = { path = "../../crates/wt-config" }
wt-ui = { path = "../../crates/wt-ui" }
wt-icons = { path = "../../crates/wt-icons" }
wt-pipewire = { path = "../../crates/wt-pipewire" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
