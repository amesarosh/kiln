[package]
name = "wayland-time-settings"
version = "0.1.0"
edition = "2024"
description = "Settings app for the wayland-time compositor"
license = "MIT"

[dependencies]
wt-config = { path = "../../crates/wt-config" }
wt-ui = { path = "../../crates/wt-ui" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
wayland-client = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
