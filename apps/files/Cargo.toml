[package]
name = "kiln-files"
version.workspace = true
edition.workspace = true
description = "File picker for the kiln compositor, offered to apps through the desktop portal"
license.workspace = true

[dependencies]
kiln-config = { path = "../../crates/kiln-config" }
kiln-ui = { path = "../../crates/kiln-ui" }
kiln-icons = { path = "../../crates/kiln-icons" }
# The session bus: xdg-desktop-portal forwards apps' file chooser requests to us.
zbus.workspace = true
# Hands each D-Bus call its answer once the picker window closes.
async-channel.workspace = true
libc.workspace = true
# Decoding GVfs's device lists (records too long for plain tuples).
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Files dragged in from other apps (winit doesn't take Wayland drops): a listener of our own
# on the window's connection.
raw-window-handle = "0.6"
wayland-client.workspace = true
wayland-backend = { version = "0.3", features = ["client_system"] }

[lints]
workspace = true
