[package]
name = "wayland-time-files"
version = "0.1.0"
edition = "2024"
description = "File picker for the wayland-time compositor, offered to apps through the desktop portal"
license = "MIT"

[dependencies]
wt-config = { path = "../../crates/wt-config" }
wt-ui = { path = "../../crates/wt-ui" }
wt-icons = { path = "../../crates/wt-icons" }
# The session bus: xdg-desktop-portal forwards apps' file chooser requests to us.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Hands each D-Bus call its answer once the picker window closes.
async-channel = "2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Files dragged in from other apps (winit doesn't take Wayland drops): a listener of our own
# on the window's connection.
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
