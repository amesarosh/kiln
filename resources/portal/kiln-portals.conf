# Which desktop portal backend handles what under kiln (matched through
# XDG_CURRENT_DESKTOP=kiln). File pickers are our own (kiln-files), screen
# sharing and screenshots need xdg-desktop-portal-wlr, and everything else uses GTK's.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=kiln;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
