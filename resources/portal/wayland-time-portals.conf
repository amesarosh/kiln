# Which desktop portal backend handles what under wayland-time (matched through
# XDG_CURRENT_DESKTOP=wayland-time). File pickers are our own (wayland-time-files), screen
# sharing and screenshots need xdg-desktop-portal-wlr, and everything else uses GTK's.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=wayland-time;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
