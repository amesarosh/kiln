# wayland-time configuration
#
# This file is reloaded automatically when you save it. If it has an error,
# the previous working config stays active and the error is logged.

[general]
# Modifier used as "Mod" in keybinds: "super", "alt", "ctrl", or "auto".
# "auto" uses Alt when running nested inside another desktop (so the host
# doesn't steal Super), and Super when running on real hardware.
mod = "auto"
# Focus the window under the pointer as it moves.
focus_follows_mouse = true
# Where new tiled windows go: "master" (becomes the main window) or "stack".
new_window = "master"
# Commands run once at startup, through `sh -c`. To lock after 5 minutes idle
# and before suspend:
#   autostart = ["swayidle -w timeout 300 'wayland-time-lock -f' before-sleep 'wayland-time-lock -f'"]
# To keep a clipboard history for Mod+v (needs cliphist):
#   autostart = ["wl-paste --watch cliphist store"]
autostart = []
# Turn monitors off after this many seconds without input (0 = never). Any key,
# click or pointer movement turns them back on. Video players can hold it off.
monitors_off_after = 0
# Lock the screen when monitors turn off, from monitors_off_after or the
# power-off-monitors action. Tools like wlopm turning them off don't lock.
lock_when_monitors_off = true
# Suspend after this many seconds without input (0 = never). The screen locks
# first, as with Suspend in the power menu. Video players can hold it off.
suspend_after = 0
# Run X11-only apps (Steam, many games, older programs) through Xwayland. Needs
# the Xwayland package; changing this takes effect after a restart.
xwayland = true
# Keep what you copied after the app you copied from closes. The compositor
# holds its own copy (up to 64 MiB); the middle-click selection isn't kept.
keep_clipboard = true
# Let apps that ask for every key get them, so your binds reach a virtual
# machine, remote desktop or game instead of the compositor. A bind to
# "toggle-shortcuts-inhibit" always works, to take the keys back.
allow_shortcuts_inhibit = true
# Let fullscreen games that ask for it put each frame on screen as soon as it's
# drawn instead of waiting for the next refresh. Less input lag, but the
# picture can tear. Only on real hardware, and only for games that ask.
allow_tearing = true
# Screen locker used by Lock and Suspend in the bar's power menu. Empty picks
# the first one installed of wayland-time-lock (our own), hyprlock, swaylock,
# gtklock and waylock.
locker = ""
# Program that asks for your password when an app needs admin rights (installing
# software, mounting a disk, `pkexec`): a polkit agent, started at login. Empty
# picks the first one installed of wayland-time-polkit (our own),
# polkit-gnome, polkit-kde, polkit-mate and lxpolkit; "none" starts none (if
# you start one yourself in autostart). Changing this takes effect at the next
# start.
polkit_agent = ""

# The look shared by everything the compositor draws: the bar, window borders,
# the lock screen, and menus and panels as they are added.
#
# Saved themes: name = "Nord" uses ~/.config/wayland-time/themes/Nord.toml, a
# file with these same keys and a [colors] table. Anything else set here goes
# on top of it. The settings app can save the current look as a theme.
[theme]
font = "sans"     # fontconfig name, or a path to a .ttf/.otf file
font_size = 14
radius = 6           # corner rounding of buttons, tabs and menus (0 = square)
icon_theme = "auto"  # icon theme for app icons; "auto" uses your GTK/GNOME setting
# Picture behind the windows: a PNG, JPEG or WebP file ("~/" is your home
# folder). Empty shows the base color. A monitor can have its own with
# `wallpaper` under [[outputs]]. Other wallpaper tools (swaybg) draw on top.
wallpaper = ""
# How it's fitted to each monitor: "fill" (cover it, cropping the edges), "fit"
# (all of it, with the base color around it), "stretch", "center" (its own
# size) or "tile".
wallpaper_fit = "fill"

# Colors are named here and every part of the UI refers to them by name, so
# changing one changes it everywhere. A value can be:
#   "#rgb", "#rrggbb" or "#rrggbbaa"   a color
#   "accent"                          another color from this list
#   "mix(surface, text, 0.1)"         10% of the way from surface to text
#   "alpha(accent, 0.2)"              accent made see-through (0 invisible, 1 solid)
# You can add your own names too (e.g. pink = "#f5c2e7", then accent = "pink").
# To change colors for one part only, give that section a colors table, e.g.
#   [bar.colors]
#   surface = "#000000"
# The derived colors below (hover and so on) follow along automatically.
[theme.colors]
# The palette.
base = "#11111b"       # behind all windows
surface = "#181825"    # bars, menus and panels
text = "#cdd6f4"       # regular text
subtext = "#6c7086"    # secondary text, empty workspaces
accent = "#89b4fa"     # focus and highlights
urgent = "#f38ba8"     # things that need attention
# Colors built from the palette.
muted = "mix(text, subtext, 0.4)"               # less important text
accent_inactive = "mix(accent, surface, 0.6)"  # accent on an unfocused monitor
on_accent = "surface"                          # text drawn on accent
raised = "mix(surface, text, 0.05)"            # items on a surface, like tabs
hover = "mix(surface, text, 0.10)"             # item under the pointer
selected = "mix(surface, text, 0.16)"          # the chosen item
separator = "mix(surface, text, 0.08)"         # thin dividing lines
border_focused = "accent"                      # focused window border
border = "#313244"                             # other window borders
backdrop = "mix(base, #000000, 0.35)"          # behind the workspaces in the overview
locked = "#000000"                             # lock screen, before the locker draws
lock_failed = "#590000"                        # lock screen if the locker crashed
scrim = "#00000099"                            # dims the screen behind a password prompt
drag_box = "alpha(accent, 0.18)"               # inside the box when dragging on the desktop
drag_box_border = "accent"                     # edge of that box
icon_outline = "alpha(text, 0.8)"              # outline around folder icons in file lists

[layout]
default = "tile"      # "tile", "vertical" (master on top) or "monocle"
master_ratio = 0.55   # share of width (height in "vertical") given to the master area
master_count = 1      # number of windows in the master column
gaps_inner = 6        # pixels between windows
gaps_outer = 6        # pixels between windows and screen edge
smart_gaps = false    # drop gaps when only one window is visible
workspaces = 9

[decoration]
border_width = 2   # colors come from border_focused, border and base in [theme.colors]

# The clickable bar: workspace buttons, one tab per window, a layout button
# and a + button. Click a workspace or tab to switch to it, middle-click a tab
# to close that window, right-click a tab for a menu (float, fullscreen, move,
# close), and scroll over the bar or empty desktop to change workspace.
[bar]
enabled = true
position = "top"         # "top", "bottom", "left" or "right"
height = 28              # top/bottom bar height; also the row height of a side bar
width = 180              # left/right bar width
# Status widgets, in this order, next to the clock (on every bar if no connected
# monitor has the clock on): "tray" (app icons), "media" (what's playing; click to
# pause, scroll to skip), "sound" (the volume: click for the Sound app, right-click
# to mute, scroll to change it), "network", "bluetooth" (click for the Bluetooth app,
# right-click to turn it on or off), "battery", "brightness" (scroll to change)
# and "notifications" (a bell: click for the list, right-click for do not
# disturb). Bluetooth, battery and brightness only show on machines that have them.
widgets = ["tray", "media", "sound", "network", "bluetooth", "battery", "brightness", "notifications"]
# font = "sans"          # defaults to [theme] font and font_size
# font_size = 14

[keyboard]
layout = "us"
variant = ""
options = ""        # e.g. "caps:escape,compose:ralt"
repeat_rate = 30    # keys per second
repeat_delay = 250  # milliseconds
numlock = true      # Num Lock on at start, so the number pad types numbers

# Pointer and touchpad settings (only apply when running from a TTY).
[input]
tap_to_click = true
natural_scroll = false
pointer_speed = 0.0  # -1.0 (slowest) to 1.0 (fastest)
# Swipe with three or four fingers: left and right change workspace, up opens
# the overview and down closes it. Other gestures (like pinch) go to apps.
gestures = true

# Bring back your apps and windows at the next start: the same monitors,
# workspaces, tiling order, sizes and layouts. Saved a few seconds after any
# change and when you quit, to ~/.local/state/wayland-time/session.toml.
[session]
restore = true    # read at startup only
# App ids never saved or started again. A trailing * matches any ending, e.g.
# "steam_app_*" for Steam games.
exclude = []

# Desktop notifications from apps, shown in a corner and kept in the bell's list
# on the bar. Click one to open it (or its app's default action); right-click
# to dismiss it.
[notifications]
enabled = true            # read at startup; off leaves them to another daemon (mako, dunst)
position = "top-right"    # "top-right", "top-left", "bottom-right" or "bottom-left"
timeout = 6               # seconds, when the app doesn't say; urgent ones stay until dismissed
max_visible = 4           # most shown at once; the rest wait in the bell's list

# Motion: switching workspaces, tiles sliding into place, the overview.
[animations]
enabled = true
workspace = "slide"   # "slide", "fade" or "none"
direction = "vertical" # which way "slide" moves: "vertical" or "horizontal"
duration = 220        # milliseconds

# Keybinds: "Modifiers+Key" = "action".
# Modifiers: Mod, Super, Alt, Ctrl, Shift. Keys use xkb names (Return, space, a, 1, F1, ...).
# A bare "Mod" binds tapping Mod on its own (no other key or click while it is held).
#
# Actions:
#   spawn <command>           run a command through `sh -c`
#   close                     ask the focused window to close
#   focus next|prev           move focus through the window list
#   swap next|prev            move the focused window through the list
#   zoom                      swap the focused window with the master
#   master-ratio +0.05|-0.05  grow/shrink the master area
#   master-count +1|-1        add/remove a master window
#   layout tile|vertical|monocle|next
#                             change the workspace layout ("vertical" puts
#                             the master on top, the rest side by side below)
#   toggle-floating           float or re-tile the focused window
#   toggle-fullscreen
#   minimize                  hide the focused window; its bar tab, Alt+Tab
#                             or a taskbar brings it back
#   workspace <n>             switch to workspace n
#   move-to-workspace <n>     send the focused window to workspace n
#   focus-monitor next|prev   move focus (and the pointer) to another monitor
#   move-to-monitor next|prev send the focused window to another monitor
#   power-off-monitors        turn monitors off until the next input
#   window-switcher next|prev pick a window from a list of all of them, most
#                             recent first; let go of the modifier to switch
#   launcher                  find and start an app (type, then Enter); text
#                             that matches no app runs as a command
#   overview                  show every workspace at once: click a window or
#                             workspace to go there, drag windows between
#                             workspaces; Escape (or the same key) goes back
#   volume +5|-5|mute         change the volume by a percentage (up to 100%),
#                             or mute; shows the level. Needs wpctl (WirePlumber)
#   reload                    reload this file (it also reloads on save)
#   quit                      exit the compositor
#
# Each monitor has its own set of workspaces; workspace keys act on the
# focused monitor. Monitors are ordered left to right.
#
# Ctrl+Alt+F1..F12 always switch virtual terminals when running from a TTY,
# and Ctrl+Alt+Backspace always quits, whatever is in [binds]. While the screen
# is locked, every other key goes to the locker, and quitting is disabled.
#
# Mouse: Mod+left-drag moves a window (and floats it), Mod+right-drag resizes it.
# If you define a [binds] table, it replaces all of these defaults.
[binds]
"Mod+Return" = "spawn alacritty"
"Mod+d" = "launcher"
"Mod+Shift+q" = "close"
"Mod+Shift+e" = "quit"
"Mod+Shift+r" = "reload"
"Mod+Escape" = "lock"
"Ctrl+Shift+Escape" = "spawn wayland-time-tasks"
# Take your binds back from an app holding every key (a VM, a remote desktop).
"Mod+Ctrl+Escape" = "toggle-shortcuts-inhibit"
# Screenshots, saved to ~/Pictures/Screenshots: pick a region (also copied to the
# clipboard), or take every monitor. Needs grim, slurp and wl-clipboard.
"Print" = 'spawn d=~/Pictures/Screenshots; mkdir -p "$d" && g=$(slurp) && f="$d/$(date +%Y-%m-%d_%H-%M-%S).png" && grim -g "$g" "$f" && wl-copy < "$f"'
"Shift+Print" = 'spawn d=~/Pictures/Screenshots; mkdir -p "$d" && grim "$d/$(date +%Y-%m-%d_%H-%M-%S).png"'
# Clipboard history: pick an old entry and copy it again (see autostart above).
"Mod+v" = "spawn cliphist list | fuzzel --dmenu | cliphist decode | wl-copy"
# Hold Alt, press Tab to move through your windows, let go to switch.
"Alt+Tab" = "window-switcher next"
"Alt+Shift+Tab" = "window-switcher prev"
# See every workspace at once.
"Mod+Tab" = "overview"
# Volume keys; hold to keep going. With Shift they move in small steps.
"XF86AudioRaiseVolume" = "volume +5"
"XF86AudioLowerVolume" = "volume -5"
"Shift+XF86AudioRaiseVolume" = "volume +1"
"Shift+XF86AudioLowerVolume" = "volume -1"
"XF86AudioMute" = "volume mute"
# Media keys: play/pause and skip in Spotify, browsers, mpv...
"XF86AudioPlay" = "media play-pause"
"XF86AudioPause" = "media play-pause"
"Pause" = "media play-pause"
"XF86AudioNext" = "media next"
"XF86AudioPrev" = "media prev"

"Mod+j" = "focus next"
"Mod+k" = "focus prev"
"Mod+Shift+j" = "swap next"
"Mod+Shift+k" = "swap prev"
"Mod+Shift+Return" = "zoom"

"Mod+h" = "master-ratio -0.05"
"Mod+l" = "master-ratio +0.05"
"Mod+i" = "master-count +1"
"Mod+o" = "master-count -1"

"Mod+t" = "layout tile"
"Mod+Shift+t" = "layout vertical"
"Mod+m" = "layout monocle"
"Mod+space" = "layout next"
"Mod+Shift+space" = "toggle-floating"
"Mod+f" = "toggle-fullscreen"

"Mod+1" = "workspace 1"
"Mod+2" = "workspace 2"
"Mod+3" = "workspace 3"
"Mod+4" = "workspace 4"
"Mod+5" = "workspace 5"
"Mod+6" = "workspace 6"
"Mod+7" = "workspace 7"
"Mod+8" = "workspace 8"
"Mod+9" = "workspace 9"
"Mod+Shift+1" = "move-to-workspace 1"
"Mod+Shift+2" = "move-to-workspace 2"
"Mod+Shift+3" = "move-to-workspace 3"
"Mod+Shift+4" = "move-to-workspace 4"
"Mod+Shift+5" = "move-to-workspace 5"
"Mod+Shift+6" = "move-to-workspace 6"
"Mod+Shift+7" = "move-to-workspace 7"
"Mod+Shift+8" = "move-to-workspace 8"
"Mod+Shift+9" = "move-to-workspace 9"

"Mod+period" = "focus-monitor next"
"Mod+comma" = "focus-monitor prev"
"Mod+Shift+period" = "move-to-monitor next"
"Mod+Shift+comma" = "move-to-monitor prev"

# Window rules. `app_id` must match exactly (a trailing * matches any ending,
# e.g. "steam_app_*"); `title` matches if it is contained in the window title.
# Both are optional, but at least one should be set. When several rules match a
# window, later ones win for anything they set. Every other key is optional:
#   floating = true           float (or false: tile, even dialogs)
#   workspace = 2             open on this workspace
#   output = "DP-5"           open on this monitor (names are in the log)
#   size = [800, 600]         size of a floating window
#   position = "center"       where a floating window opens: "center", or
#                             [x, y] from the top-left of the free area
#   fullscreen = true         open fullscreen
#   focus = false             open without taking the keyboard
#   opacity = 0.9             0.1 (nearly see-through) to 1.0
#
# [[rules]]
# app_id = "pavucontrol"
# floating = true
# size = [700, 500]
#
# [[rules]]
# app_id = "firefox"
# workspace = 2
# output = "DP-5"

# Names and icons for workspaces, shown on the bar and in the overview instead
# of the numbers. The icon is an icon name from your icon theme or an app id.
# Keybinds still use the numbers.
#
# [workspaces]
# 1 = { name = "web", icon = "firefox" }
# 2 = { name = "code" }
# 3 = { icon = "discord" }

# Monitors, matched by connector name (e.g. "DP-1", "HDMI-A-1", "eDP-1"). The
# log lists each connected monitor with its name and available modes. Monitors
# you don't list use their preferred mode at scale 1. Every key but `name` is
# optional. Changes apply when you save.
#
# [[outputs]]
# name = "DP-1"
# mode = "2560x1440@144"   # "WIDTHxHEIGHT", "WIDTHxHEIGHT@HZ" or "preferred"
# scale = 1.5              # 0.5 to 4; fractions work, whole numbers look sharpest
# position = [0, 0]        # in scaled pixels; unset monitors go to the right of set ones
# transform = "normal"     # "90", "180", "270", "flipped", "flipped-90", ... (counter-clockwise)
# bar = "left"            # this monitor's bar: "top", "bottom", "left", "right" or "none"
# clock = true            # show a 12-hour clock at the bottom (or end) of this bar
# layout = "monocle"       # this monitor's default layout, instead of [layout] default
# hdr = true               # HDR mode, on monitors that support it (real hardware only)
# sdr_brightness = 203     # in HDR mode, how bright ordinary content is, in nits (80-1000)
# wallpaper = "~/Pictures/wide.jpg"  # this monitor's wallpaper; "" for none
#
# [[outputs]]
# name = "HDMI-A-1"
# enabled = false          # leave this monitor off (at least one always stays on)
