[package]
name = "wt-config"
version = "0.1.0"
edition = "2024"
description = "wayland-time's config file and theme, shared by the compositor and its apps"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
tracing = "0.1"
xkbcommon = { version = "0.8", default-features = false }
